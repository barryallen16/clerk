<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clerk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Pixel&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 14h16v2H4zM2 8h2v12H2zm18 0h2v12h-2z"/><path d="M11 4h2v4h-2zm-3 6h2v2H8zm6 0h4v2h-4zm-1-8h4v2h-4zM0 12h2v2H0zm22 0h2v2h-2zm-12 4h4v2h-4zm-2-2h2v2H8zm6 0h2v2h-2z"/></svg></span>
        <span class="brand-name">Clerk</span>
      </div>
      <div class="field">
        <label for="emp">Employee ID</label>
        <div class="emp-row">
          <input id="emp" value="EMP123" placeholder="e.g. EMP123" />
          <button type="button" id="btn-reset" class="btn-ghost" title="Reset Session & Balances">
            <svg class="pixel-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 16h10v2H10v4H8v-2H6v-2H4v-2h2v-2h2v-2h2v4Zm12 0h-2v-5h2v5ZM4 13H2V8h2v5Zm12-9h2v2h2v2h-2v2h-2v2h-2V8H4V6h10V2h2v2Z"/></svg>
            <span>Reset</span>
          </button>
        </div>
        <span class="field-desc">Jayadithya R &bull; Engineering</span>
      </div>
      <div class="status-card">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span>Engine Connected</span>
        </div>
        <div class="status-details">Ollama (lfm3-vl) &bull; ChromaDB</div>
      </div>
    </aside>
    <main class="main">
      <header class="head">
        <div class="head-meta">
          <h1>Ask HR</h1>
          <span class="live-pill">Local Assistant</span>
        </div>
        <p>Company handbook retrieval and deterministic leave transactions.</p>
      </header>
      <section id="log" class="log"></section>
      <form id="form" class="inputbar">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4v2h16zm0 14H6v2h14zm2-12h-2v12h2zM4 4H2v18h2zm2 14H4v2h2zm0-6h4v2H6zm0-4h8v2H6z"/></svg></span>
        <input id="q" placeholder="Ask a policy question or book leave..." autocomplete="off" autofocus />
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h4v2H2v-8h2v6Zm8 0H8v-2h4v2Zm4-2h-4v-2h4v2Zm4-2h-4v-2h4v2Zm-10-2H4v-2h6v2Zm12 0h-2v-2h2v2ZM8 5H4v6H2V3h6v2Zm12 6h-4V9h4v2Zm-4-2h-4V7h4v2Zm-4-2H8V5h4v2Z"/></svg>
        </button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
